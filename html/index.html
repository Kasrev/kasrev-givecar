<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
    <title>Kasrev - Arac Verme</title>
</head>
<body>
    <div id="nui-container">
        <div class="bg-layer">
            <div class="grid-overlay"></div>
            <div class="vignette"></div>
            <div class="glow glow-red"></div>
            <div class="glow glow-blue"></div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <div class="header-center">
                    <img class="brand-logo-top" src="assets/img/ui/logo.png" alt="Logo" onerror="this.style.display='none'" />
                    <h1 class="main-title">GIVE CAR <span class="accent">MENU</span></h1>
                </div>
                <div class="header-badge sound-toggle" id="soundToggle" title="Ses Aç/Kapa">
                    <svg class="sound-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" fill="#ffffff" stroke="none"></path>
                        <path class="wave" d="M16 9 a4 4 0 0 1 0 6"></path>
                        <line class="mute-x" x1="15.5" y1="9" x2="20.5" y2="15"></line>
                        <line class="mute-x" x1="20.5" y1="9" x2="15.5" y2="15"></line>
                    </svg>
                </div>
            </div>

            <div class="section-divider"></div>

            <div class="plate-display">
                <img src="assets/img/ui/plate.png" class="plate-display-img" alt="Plaka" onerror="this.style.display='none'" />
                <span class="plate-display-text" id="platePreview">ABC123</span>
            </div>

            <div class="form-body">
                <div class="field-group">
                    <div class="input-wrap with-divider">
                        <img class="input-icon-img" src="assets/img/ui/usericon.png" alt="" onerror="this.style.display='none'" />
                        <span class="input-divider"></span>
                        <input type="number" id="targetId" class="kasrev-input" placeholder="OYUNCU ID" min="1" autocomplete="off" />
                    </div>
                </div>

                <div class="field-group">
                    <div class="input-wrap with-divider">
                        <img class="input-icon-img" src="assets/img/ui/vehicleicon.png" alt="" onerror="this.style.display='none'" />
                        <span class="input-divider"></span>
                        <input type="text" id="model" class="kasrev-input" placeholder="ARAÇ KODU" autocomplete="off" />
                    </div>
                </div>

                <div class="field-group">
                    <div class="input-wrap with-divider">
                        <img class="input-icon-img" src="assets/img/ui/plateicon.png" alt="" onerror="this.style.display='none'" />
                        <span class="input-divider"></span>
                        <input type="text" id="plate" class="kasrev-input" placeholder="PLAKA" maxlength="8" autocomplete="off" />
                    </div>
                </div>

                <div class="field-group">
                    <div class="rgb-panel" id="vehicleColorPanel">
                        <div class="rgb-panel-head" id="vehicleColorHeader">
                            <img class="input-icon-img" src="assets/img/ui/paletteicon.png" alt="" onerror="this.style.display='none'" />
                            <span class="trigger-divider"></span>
                            <span id="vehicleColorLabel">ARAÇ RENK</span>
                            <label class="rgb-preview" id="rgbPreview" style="background:#ffffff">
                                <input type="color" id="vehicleColorPicker" value="#ffffff" />
                            </label>
                        </div>
                        <input type="hidden" id="vehicleColor" value="255,255,255" />
                    </div>
                </div>

                <div class="field-group">
                    <div class="kasrev-select-box" id="plateColorBox">
                        <div class="select-trigger" id="plateColorTrigger">
                            <span class="trigger-left">
                                <img class="input-icon-img" src="assets/img/ui/paletteicon.png" alt="" onerror="this.style.display='none'" />
                                <span class="trigger-divider"></span>
                                <span id="plateColorLabel">PLAKA RENK</span>
                            </span>
                            <span class="select-arrow">&#9662;</span>
                        </div>
                        <ul class="select-options" id="plateColorOptions">
                            <li data-value="0">Beyaz Zemin - Mavi Yazı</li>
                            <li data-value="1">Siyah Zemin - Sarı Yazı</li>
                            <li data-value="2">Mavi Zemin - Sarı Yazı</li>
                            <li data-value="3">Beyaz Zemin - Mavi Yazı 2</li>
                            <li data-value="4">Beyaz Zemin - Mavi Yazı 3</li>
                            <li data-value="5">North Yankton</li>
                        </ul>
                        <input type="hidden" id="plateColor" value="" />
                    </div>
                </div>
            </div>

            <div class="action-row">
                <button class="btn btn-ghost" id="cancelBtn">IPTAL <span class="btn-key">[ESC]</span></button>
                <button class="btn btn-primary" id="giveBtn">ARACI VER <span class="btn-key">[ENTER]</span></button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
